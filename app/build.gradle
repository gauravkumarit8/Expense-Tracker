plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.expensetracker'
    compileSdk 35

    defaultConfig {
        applicationId "com.expensetracker"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
        buildConfig true
    }
    // composeOptions { kotlinCompilerExtensionVersion } removed — since
    // Kotlin 2.0, the Compose compiler plugin (applied above) determines
    // its own version from the Kotlin version directly. Setting this
    // manually alongside the new plugin would conflict.

    // Financial data: never auto-backup the DB. See REQUIREMENTS.md security section.
    // dataExtractionRules / fullBackupContent referenced in AndroidManifest.
}

dependencies {
    // Core / Compose
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.7.0"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.7.0"
    implementation "androidx.activity:activity-compose:1.8.2"
    implementation platform("androidx.compose:compose-bom:2024.02.00")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-graphics"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.material:material-icons-extended"

    // Room + SQLCipher (encrypted local DB)
    implementation "androidx.room:room-runtime:2.8.4"
    implementation "androidx.room:room-ktx:2.8.4"
    kapt "androidx.room:room-compiler:2.8.4"
    implementation "net.zetetic:android-database-sqlcipher:4.5.4"
    implementation "androidx.sqlite:sqlite:2.4.0"

    // Jetpack Security (Keystore-backed EncryptedSharedPreferences)
    implementation "androidx.security:security-crypto:1.1.0-alpha06"

    // WorkManager (battery-aware background/deferred work)
    implementation "androidx.work:work-runtime-ktx:2.9.0"

    // Biometric app lock
    implementation "androidx.biometric:biometric:1.2.0-alpha05"
    implementation "androidx.fragment:fragment-ktx:1.6.2"

    // Play Billing (subscriptions) — client-side entitlement checking only,
    // no backend of ours involved. See REQUIREMENTS.md ยง2.17 for the
    // architecture decision this represents (first INTERNET permission use).
    implementation "com.android.billingclient:billing-ktx:9.0.0"

    // Play Core In-App Update — lets the app prompt for updates using
    // Google's own Play Store data, no backend of ours needed.
    implementation "com.google.android.play:app-update-ktx:2.1.0"

    // Google Mobile Ads (AdMob) — banner ads for free-tier users, hidden
    // for Pro subscribers. Using the mature "Legacy" SDK deliberately, not
    // the new "Next-Gen" SDK (announced July 2026, different API shape) —
    // see REQUIREMENTS.md ยง2.18 for why.
    implementation "com.google.android.gms:play-services-ads:23.6.0"

    // JSON parsing for bundled bank_patterns.json
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.2"

    // Charts (lightweight, Compose-native)
    implementation "com.patrykandpatrick.vico:compose-m3:1.13.1"

    // Testing
    testImplementation "junit:junit:4.13.2"
    androidTestImplementation "androidx.test.ext:junit:1.1.5"
}