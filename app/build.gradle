plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

android {
    namespace 'com.expensetracker'
    compileSdk 34

    defaultConfig {
        applicationId "com.expensetracker"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "0.1.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
        buildConfig true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.8'
    }

    // Financial data: never auto-backup the DB. See REQUIREMENTS.md security section.
    // dataExtractionRules / fullBackupContent referenced in AndroidManifest.
}

dependencies {
    // Core / Compose
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.7.0"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.7.0"
    implementation "androidx.activity:activity-compose:1.8.2"
    implementation platform("androidx.compose:compose-bom:2024.02.00")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-graphics"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.material:material-icons-extended"

    // Room + SQLCipher (encrypted local DB)
    implementation "androidx.room:room-runtime:2.6.1"
    implementation "androidx.room:room-ktx:2.6.1"
    kapt "androidx.room:room-compiler:2.6.1"
    implementation "net.zetetic:android-database-sqlcipher:4.5.4"
    implementation "androidx.sqlite:sqlite:2.4.0"

    // Jetpack Security (Keystore-backed EncryptedSharedPreferences)
    implementation "androidx.security:security-crypto:1.1.0-alpha06"

    // WorkManager (battery-aware background/deferred work)
    implementation "androidx.work:work-runtime-ktx:2.9.0"

    // Biometric app lock
    implementation "androidx.biometric:biometric:1.2.0-alpha05"
    implementation "androidx.fragment:fragment-ktx:1.6.2"

    // JSON parsing for bundled bank_patterns.json
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.2"

    // Charts (lightweight, Compose-native)
    implementation "com.patrykandpatrick.vico:compose-m3:1.13.1"

    // Testing
    testImplementation "junit:junit:4.13.2"
    androidTestImplementation "androidx.test.ext:junit:1.1.5"
}