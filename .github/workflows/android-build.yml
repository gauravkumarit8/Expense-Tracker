name: Android Build

# Runs on every push to bug/main (the two branches actually in use) and on
# pull requests targeting them, plus a manual "Run workflow" button
# (workflow_dispatch) for on-demand builds without needing a push.
on:
  push:
    branches: [ "bug", "main" ]
  pull_request:
    branches: [ "bug", "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    # GitHub Actions does not allow the `secrets` context inside a step's
    # `if:` condition (only github/needs/strategy/matrix/job/runner/env/
    # vars/steps/inputs are permitted there — see docs.github.com/actions/
    # reference/workflows-and-actions/contexts#context-availability).
    # Computing it into a job-level env var here, then checking THAT in
    # the step's `if:` below, works around it.
    env:
      HAS_RELEASE_SIGNING: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # AGP 8.8.2 / this project require JDK 17 (see app/build.gradle
      # compileOptions). setup-java's built-in gradle cache avoids
      # re-downloading dependencies on every run.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # Installs the Android SDK (platform-tools, platforms, build-tools)
      # and accepts the licenses so Gradle doesn't fail the way it does
      # locally without ANDROID_HOME / local.properties set.
      #
      # `packages:` is set explicitly to override this action's own
      # default ("tools platform-tools") — the legacy "tools" package
      # was removed from Google's SDK repository years ago, so the
      # default fails with "Failed to find package 'tools'". AGP
      # auto-downloads whatever specific platform/build-tools versions
      # the build actually needs once licenses are accepted (handled by
      # accept-android-sdk-licenses below), so platform-tools alone is
      # enough here.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Release signing is OPTIONAL and only activates if the four secrets
      # below are configured in this repo's Settings -> Secrets and
      # variables -> Actions. Without them, app/build.gradle's own
      # hasSigningConfig check (see keystore.properties handling) simply
      # skips signing and bundleRelease still succeeds, producing an
      # UNSIGNED .aab - fine to inspect, but Play Console will reject an
      # unsigned upload, so set these secrets before relying on the
      # release artifact for a real submission.
      #
      # Required secrets (Settings -> Secrets and variables -> Actions -> New repository secret):
      #   RELEASE_KEYSTORE_BASE64  - your .jks/.keystore file, base64-encoded
      #   RELEASE_KEYSTORE_PASSWORD
      #   RELEASE_KEY_ALIAS
      #   RELEASE_KEY_PASSWORD
      - name: Set up release signing (if configured)
        if: ${{ env.HAS_RELEASE_SIGNING == 'true' }}
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > release.keystore
          cat > keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.RELEASE_KEY_ALIAS }}
          keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}
          EOF

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build release AAB
        run: ./gradlew bundleRelease --stacktrace

      - name: Clean up keystore
        if: always()
        run: rm -f release.keystore keystore.properties

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
